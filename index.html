<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuroscience Runner Game</title>
  </head>
  <body>
    <div id="app">
      <canvas id="gameCanvas"></canvas>
      <div id="ui-overlay">
        <div id="instructions">
          Jump: Space / Left Click<br>
          Slide: Down Arrow / Right Click
        </div>
        <div id="mobile-controls" style="display: none;">
          <button id="jump-btn" class="control-btn">Jump</button>
          <button id="slide-btn" class="control-btn">Slide</button>
        </div>
      </div>
      <div id="experiment-complete" style="display: none;">
        <h1>Experiment Complete</h1>
        <p>Thank you for participating.</p>
        <button id="download-btn">Download Data</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
